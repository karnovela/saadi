<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg150" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg150)"/>
  <!-- Pronoun speech bubbles: ich, du, er/sie -->
  <!-- 'ich' bubble -->
  <rect x="110" y="65" width="55" height="36" rx="10" fill="#F43F5E"/>
  <text x="137" y="89" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ich</text>
  <!-- 'du' bubble -->
  <rect x="235" y="65" width="55" height="36" rx="10" fill="#38BDF8"/>
  <text x="262" y="89" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">du</text>
  <!-- 'er / sie / es' bubble -->
  <rect x="150" y="115" width="100" height="42" rx="12" fill="#FACC15"/>
  <text x="200" y="142" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1E293B" text-anchor="middle">er / sie / es</text>
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Personalpronomen</text>
  <text x="200" y="268" font-family="Arial, sans-serif" font-size="14" fill="#DDD6FE" text-anchor="middle">Personal pronouns</text>
</svg>