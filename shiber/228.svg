<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg228" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DB2777"/>
      <stop offset="100%" stop-color="#9D174D"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg228)"/>
  <!-- Microphone -->
  <g transform="translate(180, 55)">
    <rect x="10" y="15" width="20" height="45" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
    <path d="M0 45 C0 65 40 65 40 45" stroke="#FFFFFF" stroke-width="4" fill="none"/>
    <line x1="20" y1="65" x2="20" y2="95" stroke="#FFFFFF" stroke-width="5"/>
    <line x1="5" y1="95" x2="35" y2="95" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- Music notes floating out -->
  <text x="250" y="80" font-family="Arial, sans-serif" font-size="26" fill="#FDE047">♪</text>
  <text x="280" y="110" font-family="Arial, sans-serif" font-size="34" fill="#FEF08A">♫</text>
  <text x="120" y="100" font-family="Arial, sans-serif" font-size="28" fill="#FDE047">♬</text>
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">singen</text>
  <text x="200" y="268" font-family="Arial, sans-serif" font-size="14" fill="#FCE7F3" text-anchor="middle">Singing</text>
</svg>