<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg23" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg23)"/>
  <!-- Bird Body -->
  <ellipse cx="185" cy="130" rx="45" ry="35" fill="#FEF08A"/>
  <!-- Wing -->
  <ellipse cx="170" cy="130" rx="28" ry="18" fill="#FACC15" transform="rotate(-10 170 130)"/>
  <!-- Head -->
  <circle cx="220" cy="110" r="22" fill="#FEF08A"/>
  <circle cx="228" cy="105" r="4" fill="#0F172A"/>
  <!-- Beak -->
  <polygon points="242,108 262,114 242,120" fill="#F97316"/>
  <!-- Tail -->
  <polygon points="142,135 110,120 115,145" fill="#FACC15"/>
  <text x="200" y="260" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Bird / Vogel</text>
</svg>