<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg54" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg54)"/>
  <!-- Cafe / Bar dialogue between two people -->
  <circle cx="145" cy="85" r="18" fill="#EEF2FF"/>
  <path d="M120 145 C120 110 170 110 170 145 Z" fill="#818CF8"/>
  <circle cx="255" cy="85" r="18" fill="#EEF2FF"/>
  <path d="M230 145 C230 110 280 110 280 145 Z" fill="#C084FC"/>
  <!-- Coffee cups on table -->
  <rect x="130" y="140" width="140" height="10" rx="4" fill="#FEF08A"/>
  <rect x="175" y="125" width="16" height="15" rx="3" fill="#FFFFFF"/>
  <rect x="210" y="125" width="16" height="15" rx="3" fill="#FFFFFF"/>
  <!-- Speech bubble with refresh / loop clock -->
  <rect x="180" y="55" width="40" height="30" rx="8" fill="#FDE047"/>
  <text x="200" y="76" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#312E81" text-anchor="middle">↺?</text>
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Kommen Sie öfter hier?</text>
  <text x="200" y="268" font-family="Arial, sans-serif" font-size="14" fill="#C7D2FE" text-anchor="middle">Do you come here often?</text>
</svg>