<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg88" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg88)"/>
  <!-- Big Snowflake in Center -->
  <g transform="translate(200, 105)" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round">
    <line x1="0" y1="-50" x2="0" y2="50"/>
    <line x1="-43" y1="-25" x2="43" y2="25"/>
    <line x1="-43" y1="25" x2="43" y2="-25"/>
    <!-- Snowflake branches -->
    <line x1="0" y1="-30" x2="-12" y2="-40"/>
    <line x1="0" y1="-30" x2="12" y2="-40"/>
    <line x1="0" y1="30" x2="-12" y2="40"/>
    <line x1="0" y1="30" x2="12" y2="40"/>
  </g>
  <circle cx="200" cy="105" r="8" fill="#38BDF8"/>
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">der Winter</text>
  <text x="200" y="268" font-family="Arial, sans-serif" font-size="14" fill="#BAE6FD" text-anchor="middle">Winter</text>
</svg>