  <line x1="80" y1="145" x2="320" y2="145" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <!-- Sun rays -->
  <line x1="200" y1="45" x2="200" y2="25" stroke="#FEF08A" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="140" y1="70" x2="125" y2="55" stroke="#FEF08A" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="260" y1="70" x2="275" y2="55" stroke="#FEF08A" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Morning coffee cup -->
  <rect x="260" y="125" width="22" height="18" rx="4" fill="#FFFFFF"/>
  <path d="M268 118 Q264 112 268 106" stroke="#FFFFFF" stroke-width="2" fill="none"/>
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Guten Morgen</text>
  <text x="200" y="268" font-family="Arial, sans-serif" font-size="14" fill="#FED7AA" text-anchor="middle">Good Morning</text>
</svg>