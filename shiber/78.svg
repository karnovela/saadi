<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg78" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg78)"/>
  <!-- Circle Badge -->
  <circle cx="200" cy="110" r="50" fill="#FFFFFF"/>
  <!-- Thumbs Up Icon (👍) -->
  <g transform="translate(175, 75)" fill="#16A34A">
    <!-- Hand base -->
    <rect x="0" y="30" width="45" height="35" rx="8"/>
    <!-- Thumb pointing up -->
    <rect x="5" y="5" width="15" height="30" rx="7.5"/>
    <rect x="-8" y="30" width="8" height="35" rx="3" fill="#15803D"/>
  </g>
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Ja</text>
  <text x="200" y="268" font-family="Arial, sans-serif" font-size="14" fill="#BBF7D0" text-anchor="middle">Yes</text>
</svg>