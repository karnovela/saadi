<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg29" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg29)"/>
  <!-- Paw prints trail -->
  <g fill="#CCFBF1" opacity="0.6">
    <ellipse cx="90" cy="140" rx="10" ry="7"/>
    <circle cx="82" cy="126" r="3"/>
    <circle cx="90" cy="123" r="3.5"/>
    <circle cx="98" cy="126" r="3"/>
    <ellipse cx="135" cy="110" rx="10" ry="7"/>
    <circle cx="127" cy="96" r="3"/>
    <circle cx="135" cy="93" r="3.5"/>
    <circle cx="143" cy="96" r="3"/>
  </g>
  <!-- Big Magnifying Glass -->
  <circle cx="225" cy="115" r="48" fill="#F0FDFA" stroke="#FDE047" stroke-width="7"/>
  <!-- Question mark inside lens -->
  <text x="225" y="133" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="#0D9488" text-anchor="middle">?</text>
  <line x1="260" y1="150" x2="310" y2="195" stroke="#FDE047" stroke-width="12" stroke-linecap="round"/>
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Wo ist mein Hund?</text>
  <text x="200" y="268" font-family="Arial, sans-serif" font-size="14" fill="#99F6E4" text-anchor="middle">Where is my dog?</text>
</svg>