<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg55" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DB2777"/>
      <stop offset="100%" stop-color="#9D174D"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg55)"/>
  <!-- Dancing couple holding hands -->
  <!-- Person 1 -->
  <circle cx="165" cy="75" r="18" fill="#FDF2F8"/>
  <path d="M140 140 C140 100 185 100 185 140 Z" fill="#F472B6"/>
  <!-- Person 2 spinning -->
  <circle cx="235" cy="75" r="18" fill="#FDF2F8"/>
  <path d="M210 115 L260 115 L275 155 L195 155 Z" fill="#FEF08A"/>
  <!-- Joined hands & motion whirl -->
  <path d="M175 105 Q200 90 220 105" stroke="#FFFFFF" stroke-width="4" fill="none"/>
  <!-- Musical notes -->
  <text x="130" y="65" font-family="Arial, sans-serif" font-size="20" fill="#FDE047">♪</text>
  <text x="265" y="65" font-family="Arial, sans-serif" font-size="20" fill="#FDE047">♫</text>
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Möchten Sie tanzen?</text>
  <text x="200" y="268" font-family="Arial, sans-serif" font-size="14" fill="#FCE7F3" text-anchor="middle">Would you like to dance?</text>
</svg>