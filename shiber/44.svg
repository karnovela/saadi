<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg44" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg44)"/>
  <!-- Stage spot light cone -->
  <polygon points="200,10 90,180 310,180" fill="#FACC15" opacity="0.15"/>
  <!-- 3 Band Members -->
  <circle cx="140" cy="95" r="16" fill="#F8FAFC"/>
  <!-- Guitarist silhouette -->
  <rect x="120" y="115" width="40" height="50" rx="8" fill="#F43F5E"/>
  <line x1="125" y1="110" x2="165" y2="145" stroke="#FDE047" stroke-width="4"/>
  <circle cx="200" cy="80" r="18" fill="#F8FAFC"/>
  <!-- Lead Singer with mic -->
  <rect x="180" y="105" width="40" height="60" rx="8" fill="#6366F1"/>
  <line x1="200" y1="110" x2="200" y2="155" stroke="#E2E8F0" stroke-width="3"/>
  <circle cx="200" cy="108" r="6" fill="#94A3B8"/>
  <circle cx="260" cy="95" r="16" fill="#F8FAFC"/>
  <!-- Drummer -->
  <rect x="240" y="115" width="40" height="50" rx="8" fill="#10B981"/>
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Band</text>
  <text x="200" y="268" font-family="Arial, sans-serif" font-size="14" fill="#C7D2FE" text-anchor="middle">Music band</text>
</svg>