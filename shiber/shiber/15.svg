<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg15" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg15)"/>
  <!-- German 'H' Haltestelle bus stop sign -->
  <circle cx="200" cy="110" r="50" fill="#FACC15" stroke="#16A34A" stroke-width="9"/>
  <text x="200" y="130" font-family="Arial, sans-serif" font-size="56" font-weight="900" fill="#16A34A" text-anchor="middle">H</text>
  <rect x="195" y="160" width="10" height="60" fill="#475569"/>
  <text x="200" y="260" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Bus stop? / Bushaltestelle?</text>
</svg>