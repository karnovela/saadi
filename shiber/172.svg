<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg172" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg172)"/>
  <!-- Hardcover Book with bookmark ribbon -->
  <rect x="140" y="60" width="120" height="115" rx="8" fill="#F59E0B" stroke="#FDE68A" stroke-width="3"/>
  <rect x="140" y="60" width="18" height="115" rx="4" fill="#D97706"/>
  <!-- Ribbon bookmark -->
  <polygon points="190,60 190,110 197,102 204,110 204,60" fill="#EF4444"/>
  <text x="200" y="145" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">BUCH</text>
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Das ist mein Buch</text>
  <text x="200" y="268" font-family="Arial, sans-serif" font-size="14" fill="#FDE68A" text-anchor="middle">This is my book</text>
</svg>