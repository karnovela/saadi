<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg98" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg98)"/>
  <!-- Cute Snowman with top hat, carrot nose, and falling snow -->
  <!-- Falling snowflakes -->
  <text x="110" y="70" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF">❄</text>
  <text x="290" y="75" font-family="Arial, sans-serif" font-size="20" fill="#FFFFFF">❄</text>
  <text x="130" y="125" font-family="Arial, sans-serif" font-size="18" fill="#FFFFFF">❄</text>
  <text x="270" y="135" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF">❄</text>
  <!-- Snowman body -->
  <circle cx="200" cy="155" r="35" fill="#FFFFFF"/>
  <circle cx="200" cy="105" r="24" fill="#FFFFFF"/>
  <!-- Top Hat -->
  <rect x="182" y="65" width="36" height="22" fill="#1E293B"/>
  <rect x="174" y="85" width="52" height="6" rx="2" fill="#1E293B"/>
  <!-- Face & Carrot -->
  <circle cx="192" cy="102" r="2.5" fill="#1E293B"/>
  <circle cx="208" cy="102" r="2.5" fill="#1E293B"/>
  <polygon points="200,107 218,110 200,113" fill="#F97316"/>
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Es gibt Schnee</text>
  <text x="200" y="268" font-family="Arial, sans-serif" font-size="14" fill="#BAE6FD" text-anchor="middle">There is snow</text>
</svg>