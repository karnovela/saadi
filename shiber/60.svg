<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg60" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg60)"/>
  <!-- Control Tower in background -->
  <rect x="95" y="85" width="22" height="70" fill="#E2E8F0"/>
  <polygon points="90,85 122,85 116,65 96,65" fill="#38BDF8"/>
  <!-- Airplane taking off -->
  <g transform="translate(145, 60) rotate(-15)">
    <!-- Fuselage -->
    <ellipse cx="60" cy="50" rx="65" ry="14" fill="#FFFFFF"/>
    <!-- Cockpit -->
    <path d="M110 46 Q118 50 110 54 Z" fill="#0284C7"/>
    <!-- Wings -->
    <polygon points="50,45 30,-5 60,-5 80,45" fill="#E2E8F0"/>
    <polygon points="50,55 30,105 60,105 80,55" fill="#E2E8F0"/>
    <!-- Tail Fin -->
    <polygon points="0,48 -15,15 5,15 15,48" fill="#EF4444"/>
  </g>
  <!-- Runway dashed line -->
  <line x1="80" y1="180" x2="320" y2="180" stroke="#FDE047" stroke-width="4" stroke-dasharray="14,10"/>
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Flughafen</text>
  <text x="200" y="268" font-family="Arial, sans-serif" font-size="14" fill="#BAE6FD" text-anchor="middle">Airport</text>
</svg>