<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg212" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg212)"/>
  <!-- Wall Calendar displaying 12 grid blocks -->
  <rect x="120" y="50" width="160" height="130" rx="16" fill="#FFFFFF"/>
  <rect x="120" y="50" width="160" height="28" rx="16" fill="#6366F1"/>
  <rect x="120" y="68" width="160" height="10" fill="#6366F1"/>
  <text x="200" y="70" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">12 MONATE</text>
  <!-- 4x3 Grid dots / mini months -->
  <g fill="#A78BFA" transform="translate(138, 90)">
    <rect x="0" y="0" width="22" height="18" rx="3"/>
    <rect x="32" y="0" width="22" height="18" rx="3"/>
    <rect x="64" y="0" width="22" height="18" rx="3"/>
    <rect x="96" y="0" width="22" height="18" rx="3"/>
    <rect x="0" y="25" width="22" height="18" rx="3"/>
    <rect x="32" y="25" width="22" height="18" rx="3"/>
    <rect x="64" y="25" width="22" height="18" rx="3"/>
    <rect x="96" y="25" width="22" height="18" rx="3"/>
    <rect x="0" y="50" width="22" height="18" rx="3"/>
    <rect x="32" y="50" width="22" height="18" rx="3"/>
    <rect x="64" y="50" width="22" height="18" rx="3"/>
    <rect x="96" y="50" width="22" height="18" rx="3"/>
  </g>
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">die Monate</text>
  <text x="200" y="268" font-family="Arial, sans-serif" font-size="14" fill="#DDD6FE" text-anchor="middle">The Months</text>
</svg>