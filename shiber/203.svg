  <text x="200" y="240" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Kennst du uns?</text>
  <text x="200" y="268" font-family="Arial, sans-serif" font-size="14" fill="#A7F3D0" text-anchor="middle">Do you know us?</text>
