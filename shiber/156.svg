<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg156" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg156)"/>
  <!-- Hand pointing forward at user (Du) -->
  <g transform="translate(145, 60)">
    <circle cx="55" cy="55" r="45" fill="#FFFFFF" fill-opacity="0.2"/>
    <!-- Pointing finger circle sleeve -->
    <rect x="30" y="60" width="50" height="35" rx="10" fill="#FEF08A"/>
    <!-- Tip pointing straight at you -->
    <circle cx="55" cy="50" r="22" fill="#FDE68A"/>
    <circle cx="55" cy="50" r="12" fill="#F59E0B"/>
  </g>
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle">du</text>
  <text x="200" y="268" font-family="Arial, sans-serif" font-size="15" fill="#FDE68A" text-anchor="middle">you (informal singular)</text>
</svg>