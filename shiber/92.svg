<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg92" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg92)"/>
  <!-- Meadow of 3 Blossoming Flowers -->
  <!-- Flower 1 -->
  <g transform="translate(135, 110)">
    <line x1="0" y1="20" x2="0" y2="60" stroke="#86EFAC" stroke-width="4"/>
    <circle cx="0" cy="0" r="16" fill="#FDE047"/>
    <circle cx="-14" cy="0" r="10" fill="#FFFFFF"/>
    <circle cx="14" cy="0" r="10" fill="#FFFFFF"/>
    <circle cx="0" cy="-14" r="10" fill="#FFFFFF"/>
    <circle cx="0" cy="14" r="10" fill="#FFFFFF"/>
  </g>
  <!-- Flower 2 (Center) -->
  <g transform="translate(200, 90)">
    <line x1="0" y1="25" x2="0" y2="80" stroke="#86EFAC" stroke-width="5"/>
    <circle cx="0" cy="0" r="20" fill="#F43F5E"/>
    <circle cx="-16" cy="0" r="12" fill="#FEF08A"/>
    <circle cx="16" cy="0" r="12" fill="#FEF08A"/>
    <circle cx="0" cy="-16" r="12" fill="#FEF08A"/>
    <circle cx="0" cy="16" r="12" fill="#FEF08A"/>
  </g>
  <!-- Flower 3 -->
  <g transform="translate(265, 110)">
    <line x1="0" y1="20" x2="0" y2="60" stroke="#86EFAC" stroke-width="4"/>
    <circle cx="0" cy="0" r="16" fill="#38BDF8"/>
    <circle cx="-14" cy="0" r="10" fill="#FFFFFF"/>
    <circle cx="14" cy="0" r="10" fill="#FFFFFF"/>
    <circle cx="0" cy="-14" r="10" fill="#FFFFFF"/>
    <circle cx="0" cy="14" r="10" fill="#FFFFFF"/>
  </g>
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Die Blumen blühen</text>
  <text x="200" y="268" font-family="Arial, sans-serif" font-size="14" fill="#FCE7F3" text-anchor="middle">The flowers blossom</text>
</svg>