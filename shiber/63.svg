<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg63" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg63)"/>
  <!-- Pedestrian asking directions with roadmap & Bus 'H' sign -->
  <!-- German 'H' Haltestelle Sign -->
  <circle cx="265" cy="90" r="32" fill="#FACC15" stroke="#16A34A" stroke-width="6"/>
  <text x="265" y="103" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#16A34A" text-anchor="middle">H</text>
  <rect x="262" y="122" width="6" height="40" fill="#475569"/>
  <!-- Person with dotted directional footsteps -->
  <circle cx="120" cy="95" r="18" fill="#FFFFFF"/>
  <path d="M98 160 C98 120 142 120 142 160 Z" fill="#38BDF8"/>
  <path d="M145 135 Q195 155 240 135" stroke="#FDE047" stroke-width="4" stroke-dasharray="6,4" fill="none"/>
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Wie komme ich zur Bushaltestelle?</text>
  <text x="200" y="268" font-family="Arial, sans-serif" font-size="13" fill="#FEF08A" text-anchor="middle">How do I get to the bus station?</text>
</svg>