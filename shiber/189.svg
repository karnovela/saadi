<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg189" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg189)"/>
  <!-- Blueprint roll & Drafting Triangle Ruler -->
  <rect x="120" y="60" width="160" height="110" rx="10" fill="#0C4A6E" stroke="#38BDF8" stroke-width="2"/>
  <!-- Grid lines on blueprint -->
  <line x1="140" y1="60" x2="140" y2="170" stroke="#0284C7" stroke-width="1"/>
  <line x1="180" y1="60" x2="180" y2="170" stroke="#0284C7" stroke-width="1"/>
  <line x1="220" y1="60" x2="220" y2="170" stroke="#0284C7" stroke-width="1"/>
  <line x1="260" y1="60" x2="260" y2="170" stroke="#0284C7" stroke-width="1"/>
  <!-- Set square ruler -->
  <polygon points="170,150 250,150 250,70" fill="#FDE047" opacity="0.85"/>
  <polygon points="190,140 235,140 235,95" fill="#0C4A6E"/>
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Er ist Architekt</text>
  <text x="200" y="268" font-family="Arial, sans-serif" font-size="14" fill="#BAE6FD" text-anchor="middle">He is an architect</text>
</svg>