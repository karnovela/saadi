<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg53" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg53)"/>
  <!-- Empty Chair with question mark -->
  <!-- Chair Backrest -->
  <rect x="160" y="60" width="80" height="55" rx="8" fill="#E0F2FE" stroke="#BAE6FD" stroke-width="3"/>
  <line x1="175" y1="115" x2="175" y2="135" stroke="#BAE6FD" stroke-width="5"/>
  <line x1="225" y1="115" x2="225" y2="135" stroke="#BAE6FD" stroke-width="5"/>
  <!-- Seat cushion -->
  <rect x="145" y="130" width="110" height="18" rx="6" fill="#38BDF8"/>
  <!-- Legs -->
  <line x1="155" y1="148" x2="150" y2="190" stroke="#CBD5E1" stroke-width="5" stroke-linecap="round"/>
  <line x1="245" y1="148" x2="250" y2="190" stroke="#CBD5E1" stroke-width="5" stroke-linecap="round"/>
  <!-- Big Question Mark over chair -->
  <circle cx="200" cy="85" r="18" fill="#FDE047"/>
  <text x="200" y="93" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0369A1" text-anchor="middle">?</text>
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Ist der Platz hier frei?</text>
  <text x="200" y="268" font-family="Arial, sans-serif" font-size="14" fill="#BAE6FD" text-anchor="middle">Is this seat taken / free?</text>
</svg>