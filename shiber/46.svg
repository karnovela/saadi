<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg46" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg46)"/>
  <g transform="rotate(-30 200 120)">
    <!-- Neck -->
    <rect x="194" y="20" width="12" height="90" fill="#78350F"/>
    <rect x="190" y="12" width="20" height="15" rx="3" fill="#92400E"/>
    <!-- Guitar Body (Figure-8) -->
    <ellipse cx="200" cy="120" rx="28" ry="24" fill="#F59E0B"/>
    <ellipse cx="200" cy="155" rx="38" ry="32" fill="#F59E0B"/>
    <!-- Sound hole -->
    <circle cx="200" cy="125" r="12" fill="#451A03"/>
    <!-- Strings -->
    <line x1="198" y1="20" x2="198" y2="160" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="202" y1="20" x2="202" y2="160" stroke="#FFFFFF" stroke-width="1.5"/>
  </g>
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Gitarre</text>
  <text x="200" y="268" font-family="Arial, sans-serif" font-size="14" fill="#FDE68A" text-anchor="middle">Guitar</text>
</svg>