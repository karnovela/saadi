<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg27" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg27)"/>
  <!-- Pointing Hand gesture -->
  <g transform="translate(60, 105)">
    <rect x="0" y="15" width="55" height="30" rx="10" fill="#FEF08A"/>
    <rect x="40" y="15" width="50" height="14" rx="7" fill="#FEF08A"/>
    <circle cx="85" cy="22" r="7" fill="#FDE047"/>
  </g>
  <!-- Dog with collar & medal -->
  <g transform="translate(200, 60)">
    <circle cx="50" cy="45" r="32" fill="#F59E0B"/>
    <polygon points="25,25 20,-5 45,20" fill="#B45309"/>
    <polygon points="75,25 80,-5 55,20" fill="#B45309"/>
    <circle cx="40" cy="40" r="4.5" fill="#1E293B"/>
    <circle cx="60" cy="40" r="4.5" fill="#1E293B"/>
    <ellipse cx="50" cy="55" rx="14" ry="10" fill="#FEF3C7"/>
    <ellipse cx="50" cy="50" rx="6" ry="4" fill="#1E293B"/>
    <ellipse cx="50" cy="95" rx="35" ry="25" fill="#D97706"/>
    <!-- Collar & Star Medal -->
    <rect x="25" y="70" width="50" height="8" rx="4" fill="#EF4444"/>
    <circle cx="50" cy="85" r="7" fill="#FACC15"/>
  </g>
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Das ist mein Hund</text>
  <text x="200" y="268" font-family="Arial, sans-serif" font-size="14" fill="#C7D2FE" text-anchor="middle">This is my dog</text>
</svg>