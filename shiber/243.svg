<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg243" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg243)"/>
  <!-- Playing Card 1 (Left): Ace of Spades -->
  <g transform="translate(140, 65) rotate(-10)">
    <rect width="70" height="105" rx="8" fill="#FFFFFF"/>
    <text x="15" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1E293B">A</text>
    <text x="35" y="65" font-family="Arial, sans-serif" font-size="32" fill="#1E293B" text-anchor="middle">♠</text>
  </g>
  <!-- Playing Card 2 (Right): Ace of Hearts -->
  <g transform="translate(200, 65) rotate(15)">
    <rect width="70" height="105" rx="8" fill="#FFFFFF"/>
    <text x="15" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#EF4444">A</text>
    <text x="35" y="65" font-family="Arial, sans-serif" font-size="32" fill="#EF4444" text-anchor="middle">♥</text>
  </g>
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Karten spielen</text>
  <text x="200" y="268" font-family="Arial, sans-serif" font-size="14" fill="#A7F3D0" text-anchor="middle">Playing cards</text>
</svg>