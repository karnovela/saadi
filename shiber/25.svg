<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg25" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg25)"/>
  <!-- Cat Face -->
  <circle cx="200" cy="130" r="50" fill="#E2E8F0"/>
  <!-- Triangular Ears -->
  <polygon points="155,95 140,55 180,80" fill="#CBD5E1"/>
  <polygon points="152,90 145,65 170,80" fill="#F472B6"/>
  <polygon points="245,95 260,55 220,80" fill="#CBD5E1"/>
  <polygon points="248,90 255,65 230,80" fill="#F472B6"/>
  <!-- Eyes -->
