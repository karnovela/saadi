  <line x1="180" y1="110" x2="180" y2="130" stroke="#064E3B" stroke-width="3"/>
  <ellipse cx="220" cy="120" rx="8" ry="12" fill="#10B981"/>
  <line x1="220" y1="110" x2="220" y2="130" stroke="#064E3B" stroke-width="3"/>
  <!-- Nose and Whiskers -->
  <polygon points="196,135 204,135 200,140" fill="#F472B6"/>
  <line x1="170" y1="135" x2="130" y2="130" stroke="#94A3B8" stroke-width="2"/>
  <line x1="170" y1="142" x2="130" y2="145" stroke="#94A3B8" stroke-width="2"/>
  <line x1="230" y1="135" x2="270" y2="130" stroke="#94A3B8" stroke-width="2"/>
  <line x1="230" y1="142" x2="270" y2="145" stroke="#94A3B8" stroke-width="2"/>
  <text x="200" y="260" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Cat / Katze</text>
</svg>