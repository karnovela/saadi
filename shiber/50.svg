<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg50" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg50)"/>
  <!-- Drum Body -->
  <ellipse cx="200" cy="155" rx="75" ry="24" fill="#9A3412"/>
  <rect x="125" y="95" width="150" height="60" fill="#DC2626"/>
  <!-- Zigzag tension rods -->
  <line x1="135" y1="95" x2="155" y2="155" stroke="#FFFFFF" stroke-width="3"/>
  <line x1="155" y1="155" x2="175" y2="95" stroke="#FFFFFF" stroke-width="3"/>
  <line x1="175" y1="95" x2="200" y2="155" stroke="#FFFFFF" stroke-width="3"/>
  <line x1="200" y1="155" x2="225" y2="95" stroke="#FFFFFF" stroke-width="3"/>
  <line x1="225" y1="95" x2="245" y2="155" stroke="#FFFFFF" stroke-width="3"/>
  <line x1="245" y1="155" x2="265" y2="95" stroke="#FFFFFF" stroke-width="3"/>
  <!-- Drum Top Skin -->
  <ellipse cx="200" cy="95" rx="75" ry="24" fill="#FEF08A" stroke="#E2E8F0" stroke-width="4"/>
  <!-- 2 Drumsticks striking -->
  <line x1="140" y1="45" x2="190" y2="92" stroke="#FEF3C7" stroke-width="6" stroke-linecap="round"/>
  <circle cx="190" cy="92" r="6" fill="#F59E0B"/>
  <line x1="260" y1="45" x2="210" y2="92" stroke="#FEF3C7" stroke-width="6" stroke-linecap="round"/>
  <circle cx="210" cy="92" r="6" fill="#F59E0B"/>
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Trommel</text>
  <text x="200" y="268" font-family="Arial, sans-serif" font-size="14" fill="#FED7AA" text-anchor="middle">Drum</text>
</svg>