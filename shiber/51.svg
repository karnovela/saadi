<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg51" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg51)"/>
  <!-- Violin Body -->
  <g transform="rotate(-25 200 125)">
    <!-- Scroll / Pegbox / Neck -->
    <rect x="195" y="25" width="10" height="75" fill="#B45309"/>
    <circle cx="200" cy="20" r="8" fill="#D97706"/>
    <line x1="188" y1="30" x2="212" y2="30" stroke="#FDE68A" stroke-width="3"/>
    <line x1="188" y1="40" x2="212" y2="40" stroke="#FDE68A" stroke-width="3"/>
    <!-- Waist & bouts -->
    <path d="M185 100 C170 110 170 120 180 130 C165 145 165 165 185 175 L215 175 C235 165 235 145 220 130 C230 120 230 110 215 100 Z" fill="#D97706" stroke="#92400E" stroke-width="2"/>
    <!-- F-holes -->
    <path d="M185 125 Q182 135 188 145" stroke="#451A03" stroke-width="2.5" fill="none"/>
    <path d="M215 125 Q218 135 212 145" stroke="#451A03" stroke-width="2.5" fill="none"/>
    <!-- Chin rest -->
    <ellipse cx="212" cy="172" rx="10" ry="6" fill="#1E293B"/>
  </g>
  <!-- Bow diagonally crossing -->
  <line x1="120" y1="170" x2="280" y2="70" stroke="#FDE047" stroke-width="3" stroke-linecap="round"/>
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Geige</text>
  <text x="200" y="268" font-family="Arial, sans-serif" font-size="14" fill="#FDE68A" text-anchor="middle">Violin</text>
</svg>