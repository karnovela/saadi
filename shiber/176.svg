  <text x="200" y="78" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PRONOMEN</text>
  <text x="150" y="115" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#4F46E5" text-anchor="middle">ich → mich</text>
