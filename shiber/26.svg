  <!-- Dog standing happily -->
  <ellipse cx="240" cy="135" rx="30" ry="20" fill="#FBBF24"/>
  <circle cx="265" cy="118" r="16" fill="#FBBF24"/>
  <polygon points="268,105 278,92 278,110" fill="#D97706"/>
  <circle cx="270" cy="116" r="3" fill="#1E293B"/>
  <!-- Dog legs -->
  <rect x="220" y="145" width="6" height="22" rx="3" fill="#D97706"/>
  <rect x="232" y="145" width="6" height="22" rx="3" fill="#D97706"/>
  <rect x="250" y="145" width="6" height="22" rx="3" fill="#D97706"/>
  <rect x="260" y="145" width="6" height="22" rx="3" fill="#D97706"/>
  <!-- Tail wagging -->
  <path d="M215 130 Q205 115 212 110" stroke="#FBBF24" stroke-width="6" stroke-linecap="round" fill="none"/>
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Ich habe einen Hund</text>
  <text x="200" y="268" font-family="Arial, sans-serif" font-size="14" fill="#BAE6FD" text-anchor="middle">I have a dog</text>
