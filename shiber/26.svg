      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg26)"/>
  <!-- Person holding dog leash -->
  <circle cx="160" cy="85" r="20" fill="#F8FAFC"/>
  <path d="M135 155 C135 115 185 115 185 155 Z" fill="#38BDF8"/>
  <!-- Leash curve -->
