      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg75)"/>
  <!-- Clock with forward arrow and friendly wave -->
