<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg90" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg90)"/>
  <!-- Question mark blooming out of spring garden -->
  <circle cx="200" cy="95" r="42" fill="#ECFDF5"/>
  <text x="200" y="112" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="#047857" text-anchor="middle">?</text>
  <!-- Spring flowers along bottom of circle -->
  <circle cx="165" cy="150" r="10" fill="#F472B6"/>
  <circle cx="200" cy="155" r="12" fill="#FDE047"/>
  <circle cx="235" cy="150" r="10" fill="#60A5FA"/>
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Wie ist es im Frühling?</text>
  <text x="200" y="268" font-family="Arial, sans-serif" font-size="14" fill="#A7F3D0" text-anchor="middle">How is it in spring?</text>
</svg>