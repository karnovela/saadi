<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg64" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#115E59"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg64)"/>
  <!-- Folded Map (3 panels) with GPS red pin -->
  <g transform="translate(100, 50)">
    <polygon points="0,20 65,0 65,115 0,135" fill="#CCFBF1"/>
    <polygon points="65,0 135,20 135,135 65,115" fill="#E0F2FE"/>
    <polygon points="135,20 200,0 200,115 135,135" fill="#CCFBF1"/>
    <!-- Map route lines -->
    <path d="M25 80 Q65 40 100 80 T175 40" stroke="#F59E0B" stroke-width="3" stroke-dasharray="5,3" fill="none"/>
    <!-- Red Location Pin -->
    <path d="M100 35 C90 35 82 43 82 53 C82 68 100 85 100 85 C100 85 118 68 118 53 C118 43 110 35 100 35 Z" fill="#EF4444"/>
    <circle cx="100" cy="51" r="5" fill="#FFFFFF"/>
  </g>
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Ich brauche eine Karte</text>
  <text x="200" y="268" font-family="Arial, sans-serif" font-size="14" fill="#99F6E4" text-anchor="middle">I need a map</text>
</svg>