<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg241" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#14532D"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg241)"/>
  <!-- Mountain peak in background -->
  <polygon points="120,160 200,80 280,160" fill="#166534"/>
  <polygon points="180,100 200,80 220,100" fill="#FFFFFF"/>
  <!-- Walking boot / stick -->
  <line x1="160" y1="90" x2="170" y2="170" stroke="#FDE047" stroke-width="4" stroke-linecap="round"/>
  <!-- Hiking backpack -->
  <rect x="180" y="95" width="40" height="50" rx="10" fill="#EA580C"/>
  <rect x="185" y="110" width="30" height="20" rx="4" fill="#FBBF24"/>
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">wandern</text>
  <text x="200" y="268" font-family="Arial, sans-serif" font-size="14" fill="#BBF7D0" text-anchor="middle">Hiking</text>
</svg>