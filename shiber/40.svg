<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg40" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg40)"/>
  <!-- Union Jack badge -->
  <g transform="translate(125, 55)">
    <rect width="150" height="100" rx="10" fill="#012169"/>
    <!-- Diagonal cross -->
    <line x1="0" y1="0" x2="150" y2="100" stroke="#FFFFFF" stroke-width="16"/>
    <line x1="0" y1="0" x2="150" y2="100" stroke="#C8102E" stroke-width="8"/>
    <line x1="150" y1="0" x2="0" y2="100" stroke="#FFFFFF" stroke-width="16"/>
    <line x1="150" y1="0" x2="0" y2="100" stroke="#C8102E" stroke-width="8"/>
    <!-- Center cross -->
    <line x1="75" y1="0" x2="75" y2="100" stroke="#FFFFFF" stroke-width="24"/>
    <line x1="75" y1="0" x2="75" y2="100" stroke="#C8102E" stroke-width="14"/>
    <line x1="0" y1="50" x2="150" y2="50" stroke="#FFFFFF" stroke-width="24"/>
    <line x1="0" y1="50" x2="150" y2="50" stroke="#C8102E" stroke-width="14"/>
  </g>
  <text x="200" y="235" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Englisch</text>
  <text x="200" y="265" font-family="Arial, sans-serif" font-size="14" fill="#BFDBFE" text-anchor="middle">English language</text>
</svg>