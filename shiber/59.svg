  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg59)"/>
  <!-- Wheels -->
  <circle cx="120" cy="140" r="30" fill="none" stroke="#64748B" stroke-width="8"/>
  <circle cx="120" cy="140" r="12" fill="#CBD5E1"/>
  <circle cx="280" cy="140" r="30" fill="none" stroke="#64748B" stroke-width="8"/>
