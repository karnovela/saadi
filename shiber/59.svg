  <text x="200" y="240" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Motorrad</text>
  <text x="200" y="268" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">Motorcycle</text>
