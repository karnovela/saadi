<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg65" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg65)"/>
  <!-- Butterfly with symmetrical colorful wings -->
  <g transform="translate(200, 110)">
    <!-- Wings Left -->
    <ellipse cx="-45" cy="-25" rx="42" ry="32" fill="#F472B6" transform="rotate(-15 -45 -25)"/>
    <ellipse cx="-45" cy="-25" rx="26" ry="18" fill="#FDE047" transform="rotate(-15 -45 -25)"/>
    <ellipse cx="-35" cy="25" rx="30" ry="22" fill="#38BDF8" transform="rotate(15 -35 25)"/>
    <!-- Wings Right -->
    <ellipse cx="45" cy="-25" rx="42" ry="32" fill="#F472B6" transform="rotate(15 45 -25)"/>
    <ellipse cx="45" cy="-25" rx="26" ry="18" fill="#FDE047" transform="rotate(15 45 -25)"/>
    <ellipse cx="35" cy="25" rx="30" ry="22" fill="#38BDF8" transform="rotate(-15 35 25)"/>
    <!-- Body & Antennae -->
    <ellipse cx="0" cy="0" rx="8" ry="40" fill="#1E293B"/>
    <path d="M-4 -35 Q-15 -55 -25 -50" stroke="#1E293B" stroke-width="2.5" fill="none"/>
    <path d="M4 -35 Q15 -55 25 -50" stroke="#1E293B" stroke-width="2.5" fill="none"/>
  </g>
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Schmetterling</text>
  <text x="200" y="268" font-family="Arial, sans-serif" font-size="14" fill="#DDD6FE" text-anchor="middle">Butterfly</text>
</svg>