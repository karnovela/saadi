<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg240" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg240)"/>
  <!-- Snow mountain slope -->
  <polygon points="50,200 400,120 400,200" fill="#FFFFFF"/>
  <!-- Skier in motion -->
  <circle cx="210" cy="75" r="14" fill="#FEF08A"/>
  <line x1="200" y1="90" x2="185" y2="135" stroke="#EF4444" stroke-width="6" stroke-linecap="round"/>
  <!-- Skis -->
  <line x1="140" y1="165" x2="235" y2="135" stroke="#FDE047" stroke-width="5" stroke-linecap="round"/>
  <!-- Ski poles -->
  <line x1="210" y1="95" x2="175" y2="155" stroke="#000000" stroke-width="2.5"/>
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Skifahren</text>
  <text x="200" y="268" font-family="Arial, sans-serif" font-size="14" fill="#BAE6FD" text-anchor="middle">Skiing</text>
</svg>