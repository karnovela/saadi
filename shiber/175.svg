      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0C4A6E"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg175)"/>
  <!-- Hamburg Harbor / Port Crane & Ship -->
