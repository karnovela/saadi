  <!-- Water waves -->
  <path d="M90 150 Q130 140 170 150 T250 150 T330 150" stroke="#38BDF8" stroke-width="4" fill="none"/>
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Sie wohnen in Hamburg</text>
  <text x="200" y="268" font-family="Arial, sans-serif" font-size="14" fill="#BAE6FD" text-anchor="middle">They live in Hamburg</text>
