<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg56" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg56)"/>
  <!-- Green Big Checkmark & "1+1=2" simplicity symbol -->
  <circle cx="200" cy="105" r="50" fill="#FFFFFF"/>
  <path d="M175 105 L192 122 L228 85" stroke="#16A34A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Easy math bubble -->
  <rect x="150" y="165" width="100" height="26" rx="13" fill="#BBF7D0"/>
  <text x="200" y="183" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#15803D" text-anchor="middle">1 + 1 = 2</text>
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Das ist ganz einfach</text>
  <text x="200" y="268" font-family="Arial, sans-serif" font-size="14" fill="#BBF7D0" text-anchor="middle">It is very easy</text>
</svg>