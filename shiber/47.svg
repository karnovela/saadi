<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg47" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581C87"/>
      <stop offset="100%" stop-color="#3B0764"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg47)"/>
  <!-- Stage light laser beams -->
  <polygon points="100,20 180,140 140,140" fill="#EC4899" opacity="0.35"/>
  <polygon points="200,10 160,140 240,140" fill="#38BDF8" opacity="0.35"/>
  <polygon points="300,20 220,140 260,140" fill="#FACC15" opacity="0.35"/>
  <!-- Cheering crowd silhouette with raised hands -->
  <g fill="#0F172A">
    <ellipse cx="80" cy="165" rx="14" ry="12"/>
    <line x1="75" y1="160" x2="65" y2="135" stroke="#0F172A" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="140" cy="160" rx="16" ry="14"/>
    <line x1="145" y1="155" x2="155" y2="125" stroke="#0F172A" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="200" cy="155" rx="18" ry="16"/>
    <line x1="190" y1="150" x2="180" y2="120" stroke="#0F172A" stroke-width="6" stroke-linecap="round"/>
    <line x1="210" y1="150" x2="220" y2="120" stroke="#0F172A" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="260" cy="160" rx="16" ry="14"/>
    <ellipse cx="320" cy="165" rx="14" ry="12"/>
    <rect x="50" y="165" width="300" height="30" fill="#0F172A"/>
  </g>
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Konzert</text>
  <text x="200" y="268" font-family="Arial, sans-serif" font-size="14" fill="#E9D5FF" text-anchor="middle">Concert</text>
</svg>