<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg84" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg84)"/>
  <!-- 4 Seasons Wheel -->
  <g transform="translate(200, 110)">
    <!-- Spring (Top-Left): Flower Green -->
    <path d="M0 0 L-48 0 A48 48 0 0 1 0 -48 Z" fill="#22C55E"/>
    <!-- Summer (Top-Right): Sunny Yellow -->
    <path d="M0 0 L0 -48 A48 48 0 0 1 48 0 Z" fill="#FACC15"/>
    <!-- Autumn (Bottom-Right): Orange Leaf -->
    <path d="M0 0 L48 0 A48 48 0 0 1 0 48 Z" fill="#F97316"/>
    <!-- Winter (Bottom-Left): Ice Blue -->
    <path d="M0 0 L0 48 A48 48 0 0 1 -48 0 Z" fill="#38BDF8"/>
    <circle cx="0" cy="0" r="14" fill="#FFFFFF"/>
  </g>
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">die Jahreszeiten</text>
  <text x="200" y="268" font-family="Arial, sans-serif" font-size="14" fill="#CBD5E1" text-anchor="middle">The Seasons</text>
</svg>