<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg48" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg48)"/>
  <!-- Semicircle Orchestra seating -->
  <ellipse cx="200" cy="115" rx="110" ry="45" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6,6"/>
  <ellipse cx="200" cy="125" rx="80" ry="32" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6,6"/>
  <!-- Musicians seating dots -->
  <circle cx="110" cy="115" r="7" fill="#F59E0B"/>
  <circle cx="145" cy="100" r="7" fill="#F59E0B"/>
  <circle cx="200" cy="90" r="7" fill="#F59E0B"/>
  <circle cx="255" cy="100" r="7" fill="#F59E0B"/>
  <circle cx="290" cy="115" r="7" fill="#F59E0B"/>
  <!-- Conductor standing at podium holding baton -->
  <circle cx="200" cy="140" r="10" fill="#FFFFFF"/>
  <rect x="195" y="150" width="10" height="20" fill="#FFFFFF"/>
  <!-- Conductor Baton stick -->
  <line x1="205" y1="150" x2="235" y2="128" stroke="#FDE047" stroke-width="3" stroke-linecap="round"/>
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Orchester</text>
  <text x="200" y="268" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">Orchestra</text>
</svg>