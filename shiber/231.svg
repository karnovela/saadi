      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg231)"/>
  <!-- Lined Note Paper -->
  <rect x="130" y="55" width="140" height="125" rx="10" fill="#FFFFFF"/>
  <line x1="150" y1="85" x2="250" y2="85" stroke="#94A3B8" stroke-width="2"/>
  <line x1="150" y1="105" x2="250" y2="105" stroke="#94A3B8" stroke-width="2"/>
  <line x1="150" y1="125" x2="250" y2="125" stroke="#94A3B8" stroke-width="2"/>
  <line x1="150" y1="145" x2="210" y2="145" stroke="#94A3B8" stroke-width="2"/>
  <!-- Pen writing -->
  <g transform="rotate(40 240 120)">
    <polygon points="235,50 245,50 240,30" fill="#F59E0B"/>
    <rect x="235" y="50" width="10" height="60" fill="#0F766E"/>
  </g>
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">schreiben</text>
  <text x="200" y="268" font-family="Arial, sans-serif" font-size="14" fill="#99F6E4" text-anchor="middle">Write / Writing</text>
