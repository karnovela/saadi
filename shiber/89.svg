<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg89" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bg89)"/>
  <!-- Number 4 inside calendar surrounded by 4 season symbols -->
  <rect x="150" y="60" width="100" height="95" rx="14" fill="#FFFFFF"/>
  <rect x="150" y="60" width="100" height="28" rx="14" fill="#EF4444"/>
  <rect x="150" y="78" width="100" height="10" fill="#EF4444"/>
  <text x="200" y="132" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#1E293B" text-anchor="middle">4</text>
  <!-- Mini season icons around -->
  <text x="120" y="85" font-family="Arial, sans-serif" font-size="22">🌸</text>
  <text x="260" y="85" font-family="Arial, sans-serif" font-size="22">☀️</text>
  <text x="120" y="145" font-family="Arial, sans-serif" font-size="22">🍂</text>
  <text x="260" y="145" font-family="Arial, sans-serif" font-size="22">❄️</text>
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Ein Jahr hat vier Jahreszeiten</text>
  <text x="200" y="268" font-family="Arial, sans-serif" font-size="14" fill="#C7D2FE" text-anchor="middle">A year has four seasons</text>
</svg>